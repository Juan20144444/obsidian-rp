# =========================================================
# OBSIDIAN ROLEPLAY - QBCore Clean Recipe
# Generado para txAdmin Recipe Deployer
# =========================================================

{{serverEndpoints}}
sv_maxclients {{maxClients}}
set steam_webApiKey "none"
sets tags "qbcore, roleplay, obsidian, españa"
sets locale "es-ES"
sv_hostname "Obsidian Roleplay | QBCore | DEV"
sets sv_projectName "Obsidian Roleplay"
sets sv_projectDesc "Base QBCore limpia, moderna y preparada para interacción con E."
load_server_icon myLogo.png
set sv_enforceGameBuild 2944
set onesync on

# Licencia txAdmin/Keymaster
sv_licenseKey "{{svLicense}}"

# Base de datos generada por txAdmin
set mysql_connection_string "{{dbConnectionString}}"

# Permisos txAdmin master
{{addPrincipalsMaster}}

# QBCore / Interacción
setr UseTarget false
setr inventory:framework "qb"
setr voice_useNativeAudio true
setr voice_useSendingRangeOnly true
setr voice_defaultCycle "Z"
setr voice_defaultVolume 0.3
setr voice_enableRadioAnim 1
setr voice_syncData 1

# Recursos base CFX
ensure mapmanager
ensure spawnmanager
ensure sessionmanager
ensure basic-gamemode
ensure hardcap
ensure baseevents

