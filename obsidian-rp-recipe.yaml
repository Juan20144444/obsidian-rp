$engine: 3
$onesync: on
name: Obsidian Roleplay QBCore
version: 1.0.0
author: Obsidian Roleplay DEV
description: QBCore limpio para Obsidian Roleplay, sin ojo por defecto y preparado para interacción con E.

tasks:
  # 1) Descargar los archivos oficiales de QBCore recipe para SQL/base
  - action: download_github
    src: https://github.com/qbcore-framework/txAdminRecipe
    ref: main
    dest: ./tmp/qbcore

  # 2) Descargar este repositorio Obsidian para server.cfg, logo y recursos propios
  # CAMBIA ESTA URL por tu repositorio real antes de usar la recipe.
  - action: download_github
    src: https://github.com/TU_USUARIO/obsidian-rp-recipe
    ref: main
    dest: ./tmp/obsidian

  # 3) Base de datos QBCore oficial
  - action: connect_database
  - action: query_database
    file: ./tmp/qbcore/qbcore.sql

  # 4) Config personalizada Obsidian
  - action: move_path
    src: ./tmp/obsidian/server.cfg
    dest: ./server.cfg
  - action: move_path
    src: ./tmp/obsidian/myLogo.png
    dest: ./myLogo.png

  # 5) Recursos CFX default
  - action: download_github
    src: https://github.com/citizenfx/cfx-server-data
    ref: master
    subpath: resources
    dest: ./resources/[cfx-default]
  - action: remove_path
    path: ./resources/[cfx-default]/[gameplay]/chat

  # 6) Dependencias standalone
  - action: download_file
    path: ./tmp/files/oxmysql.zip
    url: https://github.com/overextended/oxmysql/releases/download/v2.14.1/oxmysql.zip
  - action: unzip
    dest: ./resources/[standalone]
    src: ./tmp/files/oxmysql.zip
  - action: download_file
    path: ./tmp/menuv.zip
    url: https://github.com/ThymonA/menuv/releases/download/v1.4.1/menuv_v1.4.1.zip
  - action: unzip
    dest: ./resources/[standalone]/menuv
    src: ./tmp/menuv.zip
  - action: download_github
    dest: ./resources/[standalone]/bob74_ipl
    ref: master
    src: https://github.com/qbcore-framework/bob74_ipl
  - action: download_github
    dest: ./resources/[standalone]/safecracker
    ref: main
    src: https://github.com/qbcore-framework/safecracker
  - action: download_github
    dest: ./resources/[standalone]/screenshot-basic
    ref: master
    src: https://github.com/citizenfx/screenshot-basic
  - action: download_github
    dest: ./resources/[standalone]/progressbar
    ref: main
    src: https://github.com/qbcore-framework/progressbar
  - action: download_github
    dest: ./resources/[standalone]/interact-sound
    ref: master
    src: https://github.com/qbcore-framework/interact-sound
  - action: download_github
    dest: ./resources/[standalone]/connectqueue
    ref: master
    src: https://github.com/qbcore-framework/connectqueue
  - action: download_github
    dest: ./resources/[standalone]/PolyZone
    ref: master
    src: https://github.com/qbcore-framework/PolyZone
  - action: waste_time
    seconds: 10

  # 7) Voz
  - action: download_github
    dest: ./resources/[voice]/pma-voice
    ref: main
    src: https://github.com/AvarianKnight/pma-voice
  - action: download_github
    dest: ./resources/[voice]/qb-radio
    ref: main
    src: https://github.com/qbcore-framework/qb-radio

  # 8) Mapas
  - action: download_github
    dest: ./resources/[defaultmaps]/hospital_map
    ref: main
    src: https://github.com/qbcore-framework/hospital_map
  - action: download_github
    dest: ./resources/[defaultmaps]/dealer_map
    ref: main
    src: https://github.com/qbcore-framework/dealer_map
  - action: download_github
    dest: ./resources/[defaultmaps]/[prison_map]
    ref: main
    src: https://github.com/qbcore-framework/prison_map
  - action: waste_time
    seconds: 10

  # 9) Recursos propios Obsidian desde el primer arranque
  - action: move_path
    src: ./tmp/obsidian/resources/[obsidian]
    dest: ./resources/[obsidian]

  # 10) QBCore limpio. NO descargamos qb-target ni qb-loading.
